name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
      - teatcher-14 # Added since this is your current branch
      - teatcher-15

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_API_BASE_URL: https://quizbackend.rafiquka.com
        run: npm run build

      - name: Sync files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dist/*"
          target: "/home/u556728454/domains/rafiquka.com/public_html/quiz"
          strip_components: 1
          dot_match: true

      - name: Sync Laravel Backend via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "quiz-backend/*"
          target: "/home/u556728454/domains/rafiquka.com/quizbackend/"
          strip_components: 1
          dot_match: true

